<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tugay Aloğlu</title>
  <link rel="icon" type="image/png" href="channels4_profile.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #08060F;
      --surface:    #0F0A1E;
      --neon-pink:  #FF2D78;
      --neon-cyan:  #00E5FF;
      --neon-purple:#B14AFF;
      --text:       #F0E6FF;
      --muted:      #7060A0;
      --card-bg:    rgba(15,10,30,0.85);
    }

    html, body { min-height: 100%; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Synthwave grid background ── */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* Horizon gradient */
    .grid-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(177,74,255,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 60% 30% at 50% 100%, rgba(255,45,120,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 100% 60% at 50% -10%, rgba(0,229,255,0.06) 0%, transparent 70%);
    }

    /* Vertical lines */
    .grid-bg::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200%;
      height: 60%;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(255,45,120,0.12) 0px,
          rgba(255,45,120,0.12) 1px,
          transparent 1px,
          transparent 60px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255,45,120,0.08) 0px,
          rgba(255,45,120,0.08) 1px,
          transparent 1px,
          transparent 40px
        );
      mask-image: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 100%);
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03) 0px,
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 4px
      );
    }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    /* City silhouette decorative line */
    .city-line {
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-cyan), transparent);
      margin-bottom: 0.5rem;
    }

    .eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px rgba(0,229,255,0.6);
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4.2rem;
      line-height: 0.92;
      letter-spacing: 2px;
      /* Dual neon gradient */
      background: linear-gradient(160deg, #FF2D78 0%, #FF80AB 40%, #00E5FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255,45,120,0.5));
    }

    .tagline {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    /* Live badge */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(255,45,120,0.1);
      border: 1px solid rgba(255,45,120,0.45);
      border-radius: 99px;
      padding: 0.28rem 0.9rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #FF80AB;
      margin-top: 0.3rem;
      box-shadow: 0 0 12px rgba(255,45,120,0.2), inset 0 0 8px rgba(255,45,120,0.05);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--neon-pink);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-pink);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Cards ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--card-bg);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      position: relative;
      transition: transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.22s ease;
      /* Neon border via pseudo */
      border: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Left neon accent bar */
    .link-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 2px;
      transition: height 0.2s, box-shadow 0.2s;
    }

    .link-card.youtube::before  { background: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); }
    .link-card.bynogame::before { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
    .link-card.oyunfor::before  { background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); }
    .link-card.instagram::before { background: linear-gradient(180deg, #FF2D78, #B14AFF); box-shadow: 0 0 8px #B14AFF; }

    .link-card:hover {
      transform: translateY(-4px) scale(1.01);
    }

    .link-card.youtube:hover  { box-shadow: 0 0 28px rgba(255,45,120,0.35), 0 8px 32px rgba(0,0,0,0.5); border-color: rgba(255,45,120,0.35); }
    .link-card.bynogame:hover { box-shadow: 0 0 28px rgba(0,229,255,0.3),  0 8px 32px rgba(0,0,0,0.5); border-color: rgba(0,229,255,0.35); }
    .link-card.oyunfor:hover  { box-shadow: 0 0 28px rgba(177,74,255,0.35), 0 8px 32px rgba(0,0,0,0.5); border-color: rgba(177,74,255,0.35); }
    .link-card.instagram:hover { box-shadow: 0 0 28px rgba(177,74,255,0.3), 0 8px 32px rgba(0,0,0,0.5); border-color: rgba(177,74,255,0.3); }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .youtube .card-icon   { background: rgba(255,45,120,0.12); }
    .bynogame .card-icon  { background: rgba(0,229,255,0.10); }
    .oyunfor .card-icon   { background: rgba(177,74,255,0.12); }
    .instagram .card-icon { background: rgba(177,74,255,0.10); }

    .card-icon svg { width: 22px; height: 22px; }
    .youtube   .card-icon svg { color: #FF2D78; filter: drop-shadow(0 0 5px rgba(255,45,120,0.7)); }
    .bynogame  .card-icon svg { color: #00E5FF; filter: drop-shadow(0 0 5px rgba(0,229,255,0.7)); }
    .oyunfor   .card-icon svg { color: #B14AFF; filter: drop-shadow(0 0 5px rgba(177,74,255,0.7)); }
    .instagram .card-icon svg { color: #FF80AB; filter: drop-shadow(0 0 5px rgba(177,74,255,0.6)); }

    .card-text { flex: 1; min-width: 0; }

    .card-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 1.5px;
      line-height: 1.1;
    }

    .card-desc {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 1px;
      letter-spacing: 0.03em;
    }

    .card-arrow {
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s, color 0.2s;
    }
    .youtube:hover   .card-arrow { color: #FF2D78; transform: translateX(4px); }
    .bynogame:hover  .card-arrow { color: #00E5FF; transform: translateX(4px); }
    .oyunfor:hover   .card-arrow { color: #B14AFF; transform: translateX(4px); }
    .instagram:hover .card-arrow { color: #FF80AB; transform: translateX(4px); }

    /* ── Footer ── */
    .footer {
      margin-top: 2.8rem;
      font-size: 0.63rem;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer span {
      color: var(--neon-pink);
      text-shadow: 0 0 8px rgba(255,45,120,0.5);
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card { transition: none; }
      .live-dot  { animation: none; }
    }
  </style>
</head>
